  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --nuit-1: #2a0f4a;
    --nuit-2: #120627;
    --noir: #06020f;
    --magenta: #ff3fb4;
    --cyan: #3ee6ff;
    --or: #ffcc4d;
    --or-sombre: #b8860b;
    --ivoire: #fff8ea;
    --encre: #1b1030;
    --papier-motif: repeating-linear-gradient(45deg, rgba(184,134,11,.07) 0 6px, transparent 6px 14px);
  }

  html, body { min-height: 100vh; min-height: 100dvh; }

  body {
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    background: radial-gradient(ellipse at 50% -10%, var(--nuit-1) 0%, var(--nuit-2) 45%, var(--noir) 100%);
    color: var(--ivoire);
    padding: 16px 16px max(16px, env(safe-area-inset-bottom));
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .cache { display: none !important; }

  /* Projecteurs de scène, en pur CSS */
  body::before, body::after {
    content: '';
    position: fixed;
    top: -20vh;
    width: 60vw;
    height: 120vh;
    pointer-events: none;
    opacity: .28;
    z-index: 0;
  }
  body::before {
    left: -10vw;
    background: conic-gradient(from 20deg at 0% 0%, transparent 0deg, var(--magenta) 6deg, transparent 22deg);
  }
  body::after {
    right: -10vw;
    background: conic-gradient(from 320deg at 100% 0%, transparent 0deg, var(--cyan) 10deg, transparent 22deg);
  }

  .ecran {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---------- Pictos / boutons ---------- */
  button {
    font: inherit;
    color: inherit;
    border: 0;
    background: none;
    cursor: pointer;
  }
  .picto {
    min-width: 64px;
    min-height: 64px;
    border-radius: 18px;
    font-size: 30px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.08);
    border: 2px solid rgba(255,255,255,.18);
    transition: transform .1s, background .15s;
  }
  .picto:active { transform: scale(.94); background: rgba(255,255,255,.18); }
  .picto.or {
    background: linear-gradient(180deg, var(--or), #e0a020);
    border-color: #fff1b0;
    color: var(--encre);
    box-shadow: 0 6px 0 var(--or-sombre), 0 0 24px rgba(255,204,77,.35);
  }
  .picto.or:active { box-shadow: 0 2px 0 var(--or-sombre); transform: translateY(4px); }
  .picto.grand { min-width: 96px; min-height: 96px; font-size: 48px; border-radius: 28px; }
  .picto.coupe { opacity: .55; }
  .picto.confirme { background: #c1342a; border-color: #ff9a90; }

  .barre-haut {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .barre-haut .espace { flex: 1; }

  /* ---------- Accueil ---------- */
  #ecran-accueil { min-height: calc(100dvh - 32px); justify-content: center; align-items: center; text-align: center; gap: 28px; }
  .trio { font-size: clamp(56px, 14vw, 96px); letter-spacing: .1em; filter: drop-shadow(0 0 18px rgba(255,63,180,.6)); }
  .titre {
    font-size: clamp(30px, 7vw, 56px);
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.05;
    background: linear-gradient(180deg, #fff 0%, var(--cyan) 55%, var(--magenta) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 14px rgba(62,230,255,.45));
  }
  .apercu {
    display: flex;
    gap: 18px;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    color: var(--encre);
  }
  .apercu span {
    width: 76px; height: 76px;
    border-radius: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--ivoire);
    border: 3px solid var(--or);
    background-image: var(--papier-motif);
  }
  .apercu .fleche { color: var(--or); font-size: 34px; width: auto; height: auto; background: none; border: 0; }
  .accueil-pied { font-size: 13px; color: #a89bc4; }
  .accueil-pied a { color: var(--cyan); }

  /* ---------- Choix de scène ---------- */
  .scenes { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 560px) { .scenes { grid-template-columns: 1fr 1fr; } }
  .carte-scene {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 88px;
    padding: 12px 14px;
    border-radius: 20px;
    background: rgba(255,255,255,.07);
    border: 2px solid rgba(255,255,255,.16);
    text-align: left;
    width: 100%;
    transition: transform .1s;
  }
  .carte-scene:active { transform: scale(.98); }
  .carte-scene.ouverte { border-color: var(--cyan); box-shadow: 0 0 18px rgba(62,230,255,.25); }
  .carte-scene.verrou { opacity: .45; }
  .carte-scene .icone { font-size: 38px; width: 52px; text-align: center; }
  .carte-scene .infos { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .carte-scene .nom { font-weight: bold; font-size: 17px; }
  .carte-scene .lettres { font-family: 'Cursive Chasseuses'; font-size: 26px; color: var(--or); letter-spacing: .25em; }
  .carte-scene .etoiles { font-size: 20px; letter-spacing: 2px; }
  .carte-scene .etoiles .vide { opacity: .25; }
  .btn-inverse {
    min-width: 56px; min-height: 56px;
    border-radius: 16px;
    font-size: 26px;
    background: rgba(255,63,180,.18);
    border: 2px solid var(--magenta);
    box-shadow: 0 0 14px rgba(255,63,180,.35);
  }

  /* ---------- Manche ---------- */
  .chant {
    flex: 1;
    height: 22px;
    border-radius: 999px;
    background: rgba(255,255,255,.1);
    border: 2px solid rgba(255,255,255,.2);
    overflow: hidden;
    position: relative;
  }
  .chant > div {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--or));
    box-shadow: 0 0 16px var(--magenta);
    transition: width .45s cubic-bezier(.2,.9,.3,1.3);
  }

  .scene {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    padding: 16px;
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border: 2px solid rgba(62,230,255,.35);
    box-shadow: 0 0 30px rgba(62,230,255,.12), inset 0 -10px 30px rgba(0,0,0,.35);
  }
  .rideau {
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: 22px;
    color: var(--magenta);
    letter-spacing: .3em;
    text-shadow: 0 0 12px var(--magenta);
  }
  .talismans {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    padding: 6px 0 12px;
  }
  @media (max-width: 480px) {
    .scene, .talismans { grid-template-columns: repeat(2, 1fr); }
  }

  .emplacement, .talisman {
    position: relative;
    min-height: 96px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--encre);
    background: var(--ivoire);
    background-image: var(--papier-motif);
    transition: transform .15s, box-shadow .2s, border-color .2s;
  }
  .emplacement {
    border: 3px solid var(--cyan);
    box-shadow: 0 0 0 rgba(62,230,255,0);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 52px;
  }
  .emplacement .script { line-height: 1; transition: font-size .25s, transform .25s; }
  .emplacement .cursive {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: 'Cursive Chasseuses';
    font-size: 56px;
  }
  .emplacement.ok {
    border-color: var(--or);
    background: linear-gradient(180deg, #fffbe6, #ffe7a0);
    box-shadow: 0 0 22px rgba(255,204,77,.55);
  }
  .emplacement.ok .script {
    position: absolute; top: 6px; left: 10px;
    font-size: 18px; opacity: .6;
  }
  .emplacement.ok .cursive { display: flex; animation: pose .45s cubic-bezier(.2,.9,.3,1.4); }
  .emplacement.cible:not(.ok) { border-color: var(--or); box-shadow: 0 0 18px rgba(255,204,77,.45); }
  .emplacement.tremble { animation: tremble .45s; border-color: #ff6a5e; }
  .emplacement.aide:not(.ok) { animation: pulse 1.1s ease-in-out infinite; }
  .emplacement.flash::after {
    content: '';
    position: absolute; inset: -6px;
    border-radius: 24px;
    background: radial-gradient(circle, rgba(255,255,255,.9), transparent 70%);
    animation: flash .5s ease-out forwards;
    pointer-events: none;
  }

  .talisman {
    border: 3px solid var(--or);
    font-family: 'Cursive Chasseuses';
    font-size: 58px;
    box-shadow: 0 6px 0 var(--or-sombre), 0 10px 20px rgba(0,0,0,.4);
  }
  .talisman::before {
    content: '';
    position: absolute; inset: 6px;
    border-radius: 14px;
    border: 1px dashed rgba(184,134,11,.5);
    pointer-events: none;
  }
  .talisman.choisi {
    transform: translateY(-12px) scale(1.08);
    box-shadow: 0 14px 0 var(--or-sombre), 0 0 30px var(--or), 0 18px 30px rgba(0,0,0,.5);
    border-color: #fff1b0;
    z-index: 2;
  }
  .talisman.pose { visibility: hidden; }
  .talisman.retour { animation: retour .35s; }

  /* Mode inverse : les rôles s'échangent, pas les styles */
  .inverse .emplacement { font-family: 'Cursive Chasseuses'; font-size: 56px; }
  .inverse .emplacement .cursive { font-family: Arial, Helvetica, sans-serif; font-size: 52px; }
  .inverse .talisman { font-family: Arial, Helvetica, sans-serif; font-size: 52px; }

  @keyframes tremble {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px) rotate(-2deg); }
    40% { transform: translateX(9px) rotate(2deg); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 rgba(255,204,77,0); transform: scale(1); }
    50% { box-shadow: 0 0 26px rgba(255,204,77,.85); transform: scale(1.05); border-color: var(--or); }
  }
  @keyframes pose {
    0% { transform: scale(1.5) translateY(-30px); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  @keyframes flash {
    0% { opacity: 1; transform: scale(.6); }
    100% { opacity: 0; transform: scale(1.6); }
  }
  @keyframes retour {
    0% { transform: translateY(-12px) scale(1.08); }
    100% { transform: none; }
  }

  /* ---------- Bilan ---------- */
  #ecran-bilan { min-height: calc(100dvh - 32px); justify-content: center; align-items: center; text-align: center; gap: 26px; }
  .grandes-etoiles { font-size: clamp(56px, 16vw, 110px); letter-spacing: .05em; display: flex; gap: 6px; }
  .grandes-etoiles span { display: inline-block; opacity: .2; filter: grayscale(1); }
  .grandes-etoiles span.on {
    opacity: 1; filter: drop-shadow(0 0 18px var(--or));
    animation: etoile .6s cubic-bezier(.2,.9,.3,1.6) both;
  }
  .grandes-etoiles span.on:nth-child(2) { animation-delay: .25s; }
  .grandes-etoiles span.on:nth-child(3) { animation-delay: .5s; }
  @keyframes etoile {
    0% { transform: scale(0) rotate(-90deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .bilan-lettres {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    font-family: 'Cursive Chasseuses'; font-size: 40px; color: var(--encre);
  }
  .bilan-lettres span {
    width: 64px; height: 64px; border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--ivoire); border: 3px solid var(--or);
    animation: pose .5s both;
  }
  .bilan-boutons { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .bilan-boutons .action { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bilan-boutons .action span { font-size: 14px; color: #c8c0d8; letter-spacing: .5px; }

  .confettis { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .confettis i {
    position: absolute; top: -20px;
    width: 10px; height: 16px; border-radius: 3px;
    animation: tombe linear forwards;
  }
  @keyframes tombe {
    to { transform: translateY(110vh) rotate(720deg); opacity: .6; }
  }

  /* ---------- Réglages ---------- */
  .reglages {
    position: fixed;
    top: 0; right: 0;
    margin: 16px;
    padding: 14px;
    border-radius: 20px;
    background: #1a0a33;
    border: 2px solid var(--or);
    box-shadow: 0 10px 30px rgba(0,0,0,.6);
    display: flex;
    gap: 12px;
    z-index: 10;
  }

  /* ---------- Police absente ---------- */
  #police-absente {
    position: fixed; inset: 0; z-index: 20;
    background: var(--noir);
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; font-size: 18px; line-height: 1.5;
  }
</style>
</head>

<div id="police-absente" class="cache">
  La police d'écriture cursive n'a pas pu être chargée.<br>
  Ce jeu ne peut pas fonctionner sans elle. Essaie avec un autre navigateur.
</div>

<!-- ===== ACCUEIL ===== -->
<section id="ecran-accueil" class="ecran">
  <div class="trio">🎤✨🎤</div>
  <h1 class="titre">Les Chasseuses<br>de l'Alphabet</h1>
  <div class="apercu">
    <span style="font-family:Arial,Helvetica,sans-serif">a</span>
    <span class="fleche">→</span>
    <span style="font-family:'Cursive Chasseuses'">a</span>
  </div>
  <button class="picto or grand" id="btn-jouer" aria-label="Jouer">▶</button>
  <p class="accueil-pied"><a href="../index.html">← Le Grimoire</a></p>
</section>

<!-- ===== CHOIX DE SCÈNE ===== -->
<section id="ecran-choix" class="ecran cache">
  <div class="barre-haut">
    <a class="picto" href="../index.html" aria-label="Retour au Grimoire">🏠</a>
    <span class="espace"></span>
    <button class="picto" id="btn-son-choix" aria-label="Son">🔊</button>
    <button class="picto" id="btn-reglages" aria-label="Réglages">⚙️</button>
  </div>
  <div class="scenes" id="liste-scenes"></div>
</section>

<!-- ===== MANCHE ===== -->
<section id="ecran-manche" class="ecran cache">
  <div class="barre-haut">
    <button class="picto" id="btn-retour" aria-label="Retour aux scènes">←</button>
    <div class="chant"><div id="barre-chant"></div></div>
    <button class="picto" id="btn-consigne" aria-label="Écouter la consigne">🔊</button>
  </div>
  <div class="rideau">♪ ♫ ♪</div>
  <div class="scene" id="scene"></div>
  <div class="talismans" id="talismans"></div>
</section>

<!-- ===== BILAN ===== -->
<section id="ecran-bilan" class="ecran cache">
  <div class="grandes-etoiles" id="grandes-etoiles"><span>⭐</span><span>⭐</span><span>⭐</span></div>
  <div class="bilan-lettres" id="bilan-lettres"></div>
  <div class="bilan-boutons">
    <div class="action"><button class="picto grand" id="btn-scenes" aria-label="Choisir une scène">←</button><span>Scènes</span></div>
    <div class="action"><button class="picto grand" id="btn-rejouer" aria-label="Rejouer">🔁</button><span>Rejouer</span></div>
    <div class="action" id="action-suivante"><button class="picto or grand" id="btn-suivante" aria-label="Scène suivante">▶</button><span>Suivante</span></div>
  </div>
</section>

<div class="reglages cache" id="reglages">
  <button class="picto" id="btn-son" aria-label="Couper ou remettre le son">🔊</button>
  <button class="picto" id="btn-reset" aria-label="Réinitialiser la progression">🗑️</button>
  <button class="picto" id="btn-fermer-reglages" aria-label="Fermer">✖</button>
</div>

<div class="confettis" id="confettis"></div>

<script>
(function () {
  'use strict';

  // ---------- Données ----------
  const SCENES = [
    { id: 1, nom: 'Les rondes',          icone: '🌕', lettres: ['a','c','e','i','o','u'] },
    { id: 2, nom: 'Les grandes boucles', icone: '🎀', lettres: ['b','d','h','k','l','t'] },
    { id: 3, nom: 'Les ponts',           icone: '🌉', lettres: ['m','n','r','s','v','w'] },
    { id: 4, nom: 'Les jambages',        icone: '🎣', lettres: ['g','j','p','q','y','z'] },
    { id: 5, nom: 'Le concert final',    icone: '🎆', lettres: ['f','x'], final: true },
  ];
  const NOMS_LETTRES = {
    a:'a', b:'bé', c:'cé', d:'dé', e:'e', f:'effe', g:'gé', h:'ache', i:'i', j:'ji', k:'ka',
    l:'elle', m:'ème', n:'ène', o:'o', p:'pé', q:'ku', r:'erre', s:'esse', t:'té', u:'u',
    v:'vé', w:'double vé', x:'ixe', y:'i grec', z:'zède'
  };
  const CLE_STOCKAGE = 'grimoire.chasseuses-alphabet.v1';

  // ---------- Progression ----------
  // progression.scenes[id] = { etoiles: 0..3, etoilesInverse: 0..3 }
  let progression = { scenes: {}, son: true };

  function charger() {
    try {
      const brut = localStorage.getItem(CLE_STOCKAGE);
      if (brut) {
        const p = JSON.parse(brut);
        progression = { scenes: p.scenes || {}, son: p.son !== false };
      }
    } catch (e) { /* stockage bloqué : on joue sans mémoire */ }
  }
  function sauvegarder() {
    try { localStorage.setItem(CLE_STOCKAGE, JSON.stringify(progression)); } catch (e) { /* idem */ }
  }
  function infos(sceneId) {
    return progression.scenes[sceneId] || { etoiles: 0, etoilesInverse: 0 };
  }
  function sceneOuverte(sceneId) {
    return sceneId === 1 || infos(sceneId - 1).etoiles > 0;
  }
  function modeInverseDebloque(sceneId) {
    return infos(sceneId).etoiles === 3;
  }

  // ---------- Logique de manche (testable isolément) ----------
  function melanger(tab) {
    const t = tab.slice();
    for (let i = t.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [t[i], t[j]] = [t[j], t[i]];
    }
    return t;
  }

  function genererManche(sceneId, inverse) {
    const scene = SCENES.find(s => s.id === sceneId);
    let lettres = scene.lettres.slice();
    if (scene.final) {
      const reserve = SCENES.filter(s => !s.final).flatMap(s => s.lettres);
      lettres = lettres.concat(melanger(reserve).slice(0, 6 - lettres.length));
    }
    lettres = melanger(lettres);
    return {
      sceneId, inverse: !!inverse,
      emplacements: lettres,              // ordre d'affichage sur la scène
      talismans: melanger(lettres),       // ordre d'affichage des cartes
      poses: {},                          // lettre -> true une fois placée
      erreurs: 0,
      erreursParTalisman: {},
    };
  }

  // Renvoie true si le talisman va sur cet emplacement. Met à jour la manche.
  function valider(manche, talisman, emplacement) {
    if (manche.poses[talisman]) return false;
    if (talisman === emplacement) {
      manche.poses[talisman] = true;
      return true;
    }
    manche.erreurs++;
    manche.erreursParTalisman[talisman] = (manche.erreursParTalisman[talisman] || 0) + 1;
    return false;
  }

  function mancheFinie(manche) {
    return manche.emplacements.every(l => manche.poses[l]);
  }

  function calculerEtoiles(erreurs) {
    return erreurs === 0 ? 3 : erreurs <= 2 ? 2 : 1;
  }

  // ---------- Sons (Web Audio, aucun fichier) ----------
  let ctxAudio = null;
  function audio() {
    if (!progression.son) return null;
    try {
      if (!ctxAudio) ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
      if (ctxAudio.state === 'suspended') ctxAudio.resume();
      return ctxAudio;
    } catch (e) { return null; }
  }
  // notes : liste de [fréquence, durée en s]
  function jouer(notes, type) {
    const c = audio();
    if (!c) return;
    let t = c.currentTime;
    notes.forEach(([f, d]) => {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = type || 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(c.destination);
      o.start(t);
      o.stop(t + d);
      t += d * 0.85;
    });
  }
  const SON = {
    choisi:  () => jouer([[660, .09]], 'sine'),
    bon:     () => jouer([[523, .1], [659, .1], [784, .18]]),
    mauvais: () => jouer([[330, .14], [247, .22]], 'sawtooth'),
    fin:     () => jouer([[523, .12], [659, .12], [784, .12], [1047, .3], [784, .1], [1047, .4]]),
  };

  // ---------- Voix (SpeechSynthesis, fr-FR, jamais en boucle) ----------
  function parler(texte) {
    if (!progression.son || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texte);
      u.lang = 'fr-FR';
      u.rate = 0.9;
      const voix = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
      if (voix) u.voice = voix;
      else if (speechSynthesis.getVoices().length) return; // des voix, mais pas de français : silence
      speechSynthesis.speak(u);
    } catch (e) { /* silence */ }
  }
  function direLettre(l) { parler('la lettre ' + NOMS_LETTRES[l]); }

  // ---------- Écrans ----------
  const $ = id => document.getElementById(id);
  function montrer(id) {
    ['ecran-accueil', 'ecran-choix', 'ecran-manche', 'ecran-bilan'].forEach(e => $(e).classList.toggle('cache', e !== id));
    window.scrollTo(0, 0);
  }

  // ---------- Choix de scène ----------
  function etoilesHTML(n) {
    let s = '';
    for (let i = 1; i <= 3; i++) s += `<span class="${i <= n ? '' : 'vide'}">⭐</span>`;
    return s;
  }
  function rendreChoix() {
    const conteneur = $('liste-scenes');
    conteneur.innerHTML = '';
    SCENES.forEach(scene => {
      const ouverte = sceneOuverte(scene.id);
      const i = infos(scene.id);
      const ligne = document.createElement('div');
      ligne.style.display = 'flex';
      ligne.style.gap = '10px';
      ligne.style.alignItems = 'stretch';

      const carte = document.createElement('button');
      carte.className = 'carte-scene ' + (ouverte ? 'ouverte' : 'verrou');
      carte.innerHTML = `
        <span class="icone">${ouverte ? scene.icone : '🔒'}</span>
        <span class="infos">
          <span class="nom">${scene.id}. ${scene.nom}</span>
          <span class="lettres">${scene.final ? 'f x ? ? ? ?' : scene.lettres.join(' ')}</span>
          <span class="etoiles">${etoilesHTML(i.etoiles)}</span>
        </span>`;
      carte.addEventListener('click', () => {
        if (!ouverte) { SON.mauvais(); return; }
        parler(scene.nom);
        demarrerManche(scene.id, false);
      });
      ligne.appendChild(carte);

      if (ouverte && modeInverseDebloque(scene.id)) {
        const inv = document.createElement('button');
        inv.className = 'btn-inverse';
        inv.setAttribute('aria-label', 'Mode inversé');
        inv.innerHTML = `🔄<br><span style="font-size:14px">${etoilesHTML(i.etoilesInverse)}</span>`;
        inv.addEventListener('click', () => { parler('Mode inversé'); demarrerManche(scene.id, true); });
        ligne.appendChild(inv);
      }
      conteneur.appendChild(ligne);
    });
  }

  // ---------- Manche ----------
  let manche = null;
  let talismanChoisi = null;   // lettre du talisman soulevé
  let verrou = false;          // bloque les taps pendant une animation

  function demarrerManche(sceneId, inverse) {
    manche = genererManche(sceneId, inverse);
    talismanChoisi = null;
    verrou = false;
    $('ecran-manche').classList.toggle('inverse', inverse);
    $('barre-chant').style.width = '0%';

    const scene = $('scene');
    scene.innerHTML = '';
    manche.emplacements.forEach(l => {
      const e = document.createElement('button');
      e.className = 'emplacement';
      e.dataset.lettre = l;
      e.innerHTML = `<span class="script">${l}</span><span class="cursive">${l}</span>`;
      e.addEventListener('click', () => tapEmplacement(l, e));
      scene.appendChild(e);
    });

    const tal = $('talismans');
    tal.innerHTML = '';
    manche.talismans.forEach(l => {
      const t = document.createElement('button');
      t.className = 'talisman';
      t.dataset.lettre = l;
      t.textContent = l;
      t.addEventListener('click', () => tapTalisman(l, t));
      tal.appendChild(t);
    });

    montrer('ecran-manche');
  }

  function talismanEl(l) { return $('talismans').querySelector(`[data-lettre="${l}"]`); }
  function emplacementEl(l) { return $('scene').querySelector(`[data-lettre="${l}"]`); }

  function choisirTalisman(l) {
    if (talismanChoisi) talismanEl(talismanChoisi).classList.remove('choisi');
    talismanChoisi = l;
    if (l) talismanEl(l).classList.add('choisi');
  }

  function tapTalisman(l, el) {
    if (verrou || manche.poses[l]) return;
    if (talismanChoisi === l) {          // re-tap : désélection
      choisirTalisman(null);
      el.classList.add('retour');
      setTimeout(() => el.classList.remove('retour'), 400);
      return;
    }
    choisirTalisman(l);
    SON.choisi();
    direLettre(l);
  }

  function tapEmplacement(l, el) {
    if (verrou || manche.poses[l]) return;
    if (!talismanChoisi) {               // aucun talisman soulevé : on dit juste le nom
      direLettre(l);
      return;
    }
    const t = talismanChoisi;
    const ok = valider(manche, t, l);
    verrou = true;

    if (ok) {
      choisirTalisman(null);
      talismanEl(t).classList.add('pose');
      el.classList.add('ok', 'flash');
      el.classList.remove('aide');
      SON.bon();
      const n = Object.keys(manche.poses).length;
      $('barre-chant').style.width = (n / manche.emplacements.length * 100) + '%';
      setTimeout(() => {
        el.classList.remove('flash');
        verrou = false;
        if (mancheFinie(manche)) finirManche();
      }, 500);
    } else {
      el.classList.add('tremble');
      SON.mauvais();
      choisirTalisman(null);
      const tel = talismanEl(t);
      tel.classList.add('retour');
      if (manche.erreursParTalisman[t] >= 2) emplacementEl(t).classList.add('aide');
      setTimeout(() => {
        el.classList.remove('tremble');
        tel.classList.remove('retour');
        verrou = false;
      }, 500);
    }
  }

  // ---------- Bilan ----------
  function finirManche() {
    const etoiles = calculerEtoiles(manche.erreurs);
    const i = infos(manche.sceneId);
    const cle = manche.inverse ? 'etoilesInverse' : 'etoiles';
    progression.scenes[manche.sceneId] = Object.assign({ etoiles: 0, etoilesInverse: 0 }, i, { [cle]: Math.max(i[cle], etoiles) });
    sauvegarder();

    const spans = $('grandes-etoiles').children;
    for (let k = 0; k < 3; k++) spans[k].classList.toggle('on', k < etoiles);
    $('bilan-lettres').innerHTML = manche.emplacements.slice().sort().map((l, k) =>
      `<span style="animation-delay:${.8 + k * .08}s">${l}</span>`).join('');

    const suivante = SCENES.find(s => s.id === manche.sceneId + 1);
    $('action-suivante').classList.toggle('cache', !suivante);

    setTimeout(() => { SON.fin(); confettis(); }, 400);
    montrer('ecran-bilan');
  }

  function confettis() {
    const c = $('confettis');
    c.innerHTML = '';
    const couleurs = ['#ff3fb4', '#3ee6ff', '#ffcc4d', '#fff'];
    for (let k = 0; k < 60; k++) {
      const i = document.createElement('i');
      i.style.left = Math.random() * 100 + 'vw';
      i.style.background = couleurs[k % couleurs.length];
      i.style.animationDuration = (2 + Math.random() * 2) + 's';
      i.style.animationDelay = Math.random() * 1.2 + 's';
      c.appendChild(i);
    }
    setTimeout(() => { c.innerHTML = ''; }, 5000);
  }

  // ---------- Réglages ----------
  let resetArme = null;
  function rendreSon() {
    ['btn-son', 'btn-son-choix'].forEach(id => {
      $(id).textContent = progression.son ? '🔊' : '🔇';
      $(id).classList.toggle('coupe', !progression.son);
    });
  }
  function basculerSon() {
    progression.son = !progression.son;
    if (!progression.son && 'speechSynthesis' in window) speechSynthesis.cancel();
    sauvegarder();
    rendreSon();
    if (progression.son) SON.choisi();
  }

  // ---------- Branchement ----------
  $('btn-jouer').addEventListener('click', () => { audio(); parler('Choisis une scène'); rendreChoix(); montrer('ecran-choix'); });
  $('btn-retour').addEventListener('click', () => { rendreChoix(); montrer('ecran-choix'); });
  $('btn-scenes').addEventListener('click', () => { rendreChoix(); montrer('ecran-choix'); });
  $('btn-rejouer').addEventListener('click', () => demarrerManche(manche.sceneId, manche.inverse));
  $('btn-suivante').addEventListener('click', () => demarrerManche(manche.sceneId + 1, false));
  $('btn-consigne').addEventListener('click', () => parler(manche.inverse
    ? 'Touche une lettre, puis touche la même lettre en écriture d\'imprimerie sur la scène.'
    : 'Touche une lettre attachée, puis touche la même lettre sur la scène.'));
  $('btn-son').addEventListener('click', basculerSon);
  $('btn-son-choix').addEventListener('click', basculerSon);
  $('btn-reglages').addEventListener('click', () => $('reglages').classList.remove('cache'));
  $('btn-fermer-reglages').addEventListener('click', () => { $('reglages').classList.add('cache'); });
  // Réinitialisation en deux taps (pas de boîte de dialogue à lire)
  $('btn-reset').addEventListener('click', () => {
    const b = $('btn-reset');
    if (resetArme) {
      clearTimeout(resetArme); resetArme = null;
      progression.scenes = {};
      sauvegarder();
      b.classList.remove('confirme'); b.textContent = '🗑️';
      $('reglages').classList.add('cache');
      rendreChoix();
      SON.mauvais();
      return;
    }
    b.classList.add('confirme'); b.textContent = '❓';
    resetArme = setTimeout(() => { resetArme = null; b.classList.remove('confirme'); b.textContent = '🗑️'; }, 3000);
  });

  // ---------- Vérification au chargement ----------
  (function verifier() {
    const toutes = SCENES.flatMap(s => s.lettres);
    const attendu = 'abcdefghijklmnopqrstuvwxyz'.split('');
    const manquantes = attendu.filter(l => !toutes.includes(l));
    const doublons = toutes.filter((l, i) => toutes.indexOf(l) !== i);
    if (manquantes.length) console.warn('Lettres absentes des scènes :', manquantes);
    if (doublons.length) console.warn('Lettres en double :', doublons);
    SCENES.filter(s => !s.final && s.lettres.length !== 6).forEach(s => console.warn('Scène sans 6 lettres :', s.nom));
    attendu.filter(l => !NOMS_LETTRES[l]).forEach(l => console.warn('Nom de lettre manquant :', l));
    // Auto-test de la logique
    if (calculerEtoiles(0) !== 3 || calculerEtoiles(2) !== 2 || calculerEtoiles(3) !== 1) console.warn('calculerEtoiles incohérent');
    const m = genererManche(5, false);
    if (m.emplacements.length !== 6 || new Set(m.emplacements).size !== 6 || !m.emplacements.includes('f') || !m.emplacements.includes('x'))
      console.warn('genererManche(5) incohérent :', m.emplacements);
    const m2 = genererManche(1, false);
    const l0 = m2.emplacements[0], l1 = m2.emplacements[1];
    if (valider(m2, l0, l1) !== false || m2.erreurs !== 1 || valider(m2, l0, l0) !== true || valider(m2, l0, l0) !== false)
      console.warn('valider incohérent');
  })();

  // ---------- Démarrage ----------
  charger();
  rendreSon();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('40px "Cursive Chasseuses"').then(f => {
      if (!f.length) $('police-absente').classList.remove('cache');
    }).catch(() => $('police-absente').classList.remove('cache'));
  }
  if ('speechSynthesis' in window) speechSynthesis.getVoices(); // amorce la liste des voix
})();
</script>
</body>
